// Shipping bots at Easy/Normal/Hard with Boost on a seeded four-seat Crossfeed, for ROAD#10 and ROAD#5 sessions.
//
// Run:     ColourWars.exe +exec review_bots_boost +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-bots-boost-<time>\bots-boost-30s.png
// Log:     the roster (P2 easy +2, P3 normal +1 against P4 hard beside P1),
//          then the checksum (seed 7 repeats it) and the coverage per team.
// Leaves:  the match paused on that frame with the roster as planned; the
//          P1 paint bot, seed, screenshot folder and timescale put back.
//          For an attended session, drop `bot 1 paint` and play P1.

screenshot.dir review-bots-boost-{time}
seed 7
bot 1 paint
players 4
seat 2 bot easy
seat 2 boost 2
seat 2 team b
seat 3 bot normal
seat 3 boost 1
seat 3 team b
seat 4 bot hard
seat 4 team a
stage crossfeed
timescale 4
wait match
status
wait 30s
pause on
checksum
screenshot bots-boost-30s
timescale 1
bot off
seed off
screenshot.dir off
echo review_bots_boost: done
