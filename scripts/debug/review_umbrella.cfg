// Two umbrellas trade fans above Sluice Works. In four panes a sprayer and
// a bucket join them from the lower gate approaches.
// Run: ColourWars.exe +exec review_umbrella +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-umbrella-<time>\

screenshot.dir review-umbrella-{time}
screenshot.strip off
seed 7
overlay none
// The keyboard seat is scripted; keep the desktop pointer out of its picture.
tune presentation.hud.cursor_marker.enabled off
timescale 4
pause off
bot off
players 2
bot 1 idle
bot 2 idle
weapon all umbrella
stage sluice_works
wait match
wait 65
pause on
goto inspection_landing_a 1
goto bridge_centre 2
screenshot 2p-folded
bot 1 chase
bot 2 chase
pause off
wait 9
pause on
checksum
screenshot 2p-fan
// Let the first volleys strike. Put both seats back on their marks without
// rebuilding the match so the next fan is visible between the damaged ribs.
pause off
wait 17
pause on
goto inspection_landing_a 1
goto bridge_centre 2
pause off
wait 12
pause on
checksum
screenshot 2p-crossfire

pause off
bot off
players 4
bot 1 idle
bot 2 idle
bot 3 idle
bot 4 idle
weapon 1 umbrella
weapon 2 umbrella
weapon 3 sprayer
weapon 4 bucket
stage sluice_works
wait match
wait 65
pause on
goto inspection_landing_a 1
goto bridge_centre 2
goto gate_approach_a 3
goto gate_approach_b 4
bot 1 chase
bot 2 chase
bot 3 chase
bot 4 chase
pause off
wait 9
pause on
checksum
screenshot 4p-fan
tune.reset presentation.hud.cursor_marker.enabled
exec review_arena_end
