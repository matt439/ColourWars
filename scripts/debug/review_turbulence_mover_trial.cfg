// Arena review pack for turbulence_mover_trial: review_arena's frames, then every station on the one-player heavy frame.
//
// Run:     ColourWars.exe +exec review_turbulence_mover_trial +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-turbulence_mover_trial-<time>\, plus
//          station-<name>.png with the station labels on.
// Leaves:  as review_arena, with seat 1 at the last station and the
//          station overlay off again.

exec review_arena_frames turbulence_mover_trial
// goto moves the camera at once, so each shot is the same paused frame.
overlay.stations on
goto home_lower_exit_a
screenshot station-home_lower_exit_a
goto home_lower_exit_b
screenshot station-home_lower_exit_b
goto home_upper_exit_a
screenshot station-home_upper_exit_a
goto home_upper_exit_b
screenshot station-home_upper_exit_b
goto upper_receiver_a
screenshot station-upper_receiver_a
goto upper_receiver_b
screenshot station-upper_receiver_b
goto crossover_end_a
screenshot station-crossover_end_a
goto crossover_end_b
screenshot station-crossover_end_b
goto lower_cover_a
screenshot station-lower_cover_a
goto lower_cover_b
screenshot station-lower_cover_b
goto mover_outer_end_a
screenshot station-mover_outer_end_a
goto mover_outer_end_b
screenshot station-mover_outer_end_b
goto mover_inner_end_a
screenshot station-mover_inner_end_a
goto mover_inner_end_b
screenshot station-mover_inner_end_b
overlay.stations off
exec review_arena_end
