// Arena review pack for turbulence_slab_trial: review_arena's frames, then every station on the one-player heavy frame.
//
// Run:     ColourWars.exe +exec review_turbulence_slab_trial +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-turbulence_slab_trial-<time>\, plus
//          station-<name>.png with the station labels on.
// Leaves:  as review_arena, with seat 1 at the last station and the
//          station overlay off again.

exec review_turbulence_family turbulence_slab_trial
exec review_turbulence_extra_stations mover_outer_end_a mover_outer_end_b mover_inner_end_a mover_inner_end_b
exec review_turbulence_end
