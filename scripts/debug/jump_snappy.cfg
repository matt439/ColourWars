// Jump candidate "snappy" for POL#3, on the Movement Course: held 163 high, 0.65 s airborne, tap 85.
//
// Run:     ColourWars.exe +exec jump_snappy
// Compare: jump_baseline selects the 2026-10-08 historical movement profile.
// Restore: tune.reset tuning returns to loaded defaults; exec crossfeed_coupled selects P3 on Crossfeed.
// Keep:    tune.save tuning writes the candidate into game/content/tuning.json.

players 1
stage movement_course
wait match
tune.reset tuning
tune tuning.player.gravity 3600.0
tune tuning.player.jump_launch_velocity -750.0
tune tuning.player.jump_acceleration -2400.0
tune tuning.player.jump_max_time 0.18
echo jump_snappy: held 163 high, 0.65 s airborne, tap 85
