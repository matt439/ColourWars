// Helper for review_arena and the review_<stage> wrappers: every frame of stage $1, ending paused on the one-player heavy frame.
//
// Four seats first and one last, so a wrapper can photograph stations on a
// full-screen painted pane before review_arena_end puts the session back.

screenshot.dir review-$1-{time}
screenshot.strip off
seed 7
overlay none
exec review_arena_pass $1 4
exec review_arena_pass $1 3
exec review_arena_pass $1 2
exec review_arena_pass $1 1
