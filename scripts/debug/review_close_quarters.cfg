// Arena review pack for close_quarters: review_arena's frames, then every station on the one-player heavy frame.
//
// Run:     ColourWars.exe +exec review_close_quarters +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-close_quarters-<time>\, plus
//          station-<name>.png with the station labels on.
// Leaves:  as review_arena, with seat 1 at the last station and the
//          station overlay off again.

exec review_arena_frames close_quarters
// goto moves the camera at once, so each shot is the same paused frame.
overlay.stations on
goto main_contest
screenshot station-main_contest
goto lower_bypass
screenshot station-lower_bypass
goto upper_crossing
screenshot station-upper_crossing
goto home_a_exit
screenshot station-home_a_exit
goto home_b_exit
screenshot station-home_b_exit
overlay.stations off
exec review_arena_end
