// Jump candidate "baseline" for POL#3, on the Movement Course: held 207 high, 1.02 s airborne, tap 95 (the shipped values).
//
// Run:     ColourWars.exe +exec jump_baseline
// Compare: exec another jump_*.cfg in the console; jump_baseline puts the shipped values back.
// Keep:    tune.save tuning writes the candidate into game/content/tuning.json.

players 1
stage movement_course
wait match
tune.reset tuning
tune tuning.player.gravity 2000.0
tune tuning.player.jump_launch_velocity -600.0
tune tuning.player.jump_acceleration -1300.0
tune tuning.player.jump_max_time 0.35
echo jump_baseline: held 207 high, 1.02 s airborne, tap 95 (the shipped values)
