// 2026-10-08 historical movement profile on the Movement Course: held 207 high, 1.02 s airborne, tap 95.
//
// Run:     ColourWars.exe +exec jump_baseline
// Compare: jump_baseline selects the 2026-10-08 historical movement profile.
// Restore: tune.reset tuning returns to loaded defaults; exec crossfeed_coupled selects P3 on Crossfeed.
// Keep:    tune.save tuning writes the candidate into game/content/tuning.json.

players 1
stage movement_course
wait match
tune.reset tuning
tune tuning.player.gravity 2000.0
tune tuning.player.jump_launch_velocity -600.0
tune tuning.player.jump_acceleration -1300.0
tune tuning.player.jump_max_time 0.35
echo jump_baseline: 2026-10-08 historical movement profile, held 207 high, 1.02 s airborne, tap 95
