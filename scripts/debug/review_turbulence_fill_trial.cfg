// Turbulence Yard - Fill Trial: 2/4-pane views of a real fill and its recovery.
// Run: ColourWars.exe +exec review_turbulence_fill_trial +quit
// Compare runs with the shared Reduce effects option off and on.
screenshot.dir review-yard-fill-{time}
screenshot.strip off
seed 7
overlay none
timescale 4
pause off

bot off
players 2
bot 1 idle
bot 2 idle
weapon 1 sprayer
stage turbulence_fill_trial
wait match
wait 65
pause on
exec yard_fill_pass 2

pause off
players 4
bot 1 idle
bot 2 idle
bot 3 idle
bot 4 idle
weapon 1 sprayer
stage turbulence_fill_trial
wait match
wait 65
pause on
goto crossover_end_a 3
goto lower_cover_b 4
exec yard_fill_pass 4

exec review_arena_end
