// Paused at the start of the Fill Trial. P2 watches the same strip in every still.
goto fill_right 1
goto fill_left 2
screenshot $1p-ready

// P1 paints five tiles of the left trigger while aiming across the baffle at P2.
goto fill_left 1
goto fill_right 2
bot 1 chase
pause off
wait 8
pause on
bot 1 idle

// Repeat from the other side: ten tiles qualify and the top fills at once.
goto fill_right 1
goto fill_left 2
bot 1 chase
pause off
wait 8
pause on
bot 1 idle
checksum
screenshot $1p-sweep-early
pause off
wait 16
pause on
screenshot $1p-sweep-late
pause off
wait 30
pause on
screenshot $1p-cooldown
pause off
wait 180
pause on
screenshot $1p-rearmed
