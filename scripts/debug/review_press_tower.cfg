// Arena review pack for press_tower: review_arena's frames, then every station on the one-player heavy frame.
//
// Run:     ColourWars.exe +exec review_press_tower +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-press_tower-<time>\, plus
//          station-<name>.png with the station labels on.
// Leaves:  as review_arena, with seat 1 at the last station and the
//          station overlay off again.

exec review_arena_frames press_tower
// goto moves the camera at once, so each shot is the same paused frame.
overlay.stations on
goto press_head_a
screenshot station-press_head_a
goto press_head_b
screenshot station-press_head_b
goto crown
screenshot station-crown
goto press_bed
screenshot station-press_bed
goto shoulder_a
screenshot station-shoulder_a
goto shoulder_b
screenshot station-shoulder_b
goto frame_a
screenshot station-frame_a
goto frame_b
screenshot station-frame_b
goto stair_3_a
screenshot station-stair_3_a
goto stair_3_b
screenshot station-stair_3_b
goto stair_2_a
screenshot station-stair_2_a
goto stair_2_b
screenshot station-stair_2_b
goto gantry_a
screenshot station-gantry_a
goto gantry_b
screenshot station-gantry_b
goto catwalk_a
screenshot station-catwalk_a
goto catwalk_b
screenshot station-catwalk_b
goto yard_a
screenshot station-yard_a
goto yard_b
screenshot station-yard_b
overlay.stations off
exec review_arena_end
