// Arena review pack for one stage ($1): seeded paint-bot frames at 4, 3, 2 and 1 players, clean at GO and heavy after 20 match seconds.
//
// Run:     exec review_arena <stage>, or a review_<stage> wrapper:
//          ColourWars.exe +exec review_press_tower +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-<stage>-<time>\
//          <n>p-clean.png (the GO frame, banner included) and <n>p-heavy.png
//          (20 match seconds of paint bots), for n = 4, 3, 2, 1.
// Log:     one `checksum` line before each shot; seed 7 repeats them.
// Leaves:  the one-player match paused on its heavy frame; the bots, seed,
//          strip, screenshot folder and timescale back as they were. Not put
//          back: the overlays (all off).

exec review_arena_frames $1
exec review_arena_end
