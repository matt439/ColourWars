// Every Turbulence variant's stations: the shared ten on the blockout and the gate trial, plus the mover ends on the mover, ferry and slab trials.
//
// Run:     ColourWars.exe +exec turbulence_station_tours +quit
//          (add +script.background 1 to run it in a window that is not in front)
// Screens: one turbulence-stations-<stage>-<time> folder per variant.
// Leaves:  one player on the slab trial, god and the overlay off again.

exec turbulence_station_tour turbulence_blockout
exec turbulence_station_tour turbulence_gate_trial
exec turbulence_mover_station_tour turbulence_mover_trial
exec turbulence_mover_station_tour turbulence_ferry_trial
exec turbulence_mover_station_tour turbulence_slab_trial
echo turbulence_station_tours: done (five variants, 62 stations)
