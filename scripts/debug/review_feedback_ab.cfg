// Movement feedback A/B: original, rotating, posed; feedback on and off at the same frames.
//
// Run:     ColourWars.exe +exec review_feedback_ab +quit      (or `exec review_feedback_ab`)
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-feedback-ab-<time>\
//          <visual>-<frame>-on.png and -off.png: each pair is one paused
//          simulation frame, drawn with feedback on and then off.
// Log:     one `checksum` line per frame. The seed and the rebuild repeat the
//          bots and the palette on every pass, so equal checksums across the
//          three visuals at one frame mean the art does not touch the
//          simulation; `bursts` must be above 0 for the pair to show anything.
// Leaves:  the match running, unpaused at timescale 1; the strip, the
//          screenshot folder, the bots and the seed back as they were. Not put
//          back: the overlays (all off), feedback (on) and the last pass's
//          match - the Movement Course, four seats, visual posed.

screenshot.dir review-feedback-ab-{time}
screenshot.strip off
seed 4242
overlay none
feedback on
pause off
// Every seat jumps: seat 1 (the keyboard seat) by name, the idle dummies too.
bot 1 jump
players 4 jump

exec feedback_ab_pass original
exec feedback_ab_pass rotating
exec feedback_ab_pass posed

// Back to how it was found.
screenshot.strip on
screenshot.dir off
bot off
seed off
timescale 1
echo review_feedback_ab: done (3 visuals x 3 frames x on/off)
