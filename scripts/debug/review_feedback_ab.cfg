// Movement feedback A/B: feedback on and off at the same three frames.
//
// Run:     ColourWars.exe +exec review_feedback_ab +quit      (or `exec review_feedback_ab`)
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-feedback-ab-<time>\
//          <frame>-on.png and -off.png: each pair is one paused
//          simulation frame, drawn with feedback on and then off.
// Log:     one `checksum` line per frame; `bursts` must be above 0 for the
//          pair to show anything. The seed repeats the bots and palette.
// Leaves:  the match running, unpaused at timescale 1; the strip, the
//          screenshot folder, the bots and the seed back as they were. Not put
//          back: the overlays (all off), feedback (on) and the last pass's
//          match - the Movement Course with four seats.

screenshot.dir review-feedback-ab-{time}
screenshot.strip off
seed 4242
overlay none
feedback on
pause off
// Every seat jumps: seat 1 (the keyboard seat) by name, the idle dummies too.
bot 1 jump
players 4 jump

exec feedback_ab_pass

// Back to how it was found.
screenshot.strip on
screenshot.dir off
bot off
seed off
timescale 1
echo review_feedback_ab: done (3 frames x on/off)
