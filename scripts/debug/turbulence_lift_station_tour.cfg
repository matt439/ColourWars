// The shared Turbulence stations plus the top and foot of each lift on stage $1, one screenshot each.
//
// Run:     ColourWars.exe +exec turbulence_lift_station_tour turbulence_lift_trial +quit
//          (turbulence_station_tours runs every variant)
// Screens: %LOCALAPPDATA%\ColourWars\screens\turbulence-stations-$1-<time>\<station>.png
// Leaves:  one player on $1, god and the overlay off again.

exec station_tour_begin $1 turbulence-stations-$1

exec turbulence_station_tour_shared $1

// A lift has no dwell at its ends, so each station is photographed paused
// as placed: the body at the station, the lift wherever its phase has it.
pause on
goto lift_top_a
screenshot lift_top_a
goto lift_top_b
screenshot lift_top_b
goto lift_foot_a
screenshot lift_foot_a
goto lift_foot_b
screenshot lift_foot_b
pause off

exec station_tour_end
echo turbulence_lift_station_tour $1: done (14 stations)
