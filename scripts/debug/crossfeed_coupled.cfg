// P3 Crossfeed comparison: provisional global compatibility movement and coupled tools.
// Run: ColourWars.exe +exec crossfeed_coupled
// Compare live: exec crossfeed_baseline, exec crossfeed_movement or exec crossfeed_lower.
// Keeps the 200-unit rise reach needed by existing arenas, with shorter airtime.
// Live tuning is global. No per-stage movement profile is implemented.
// Inspect: tune.diff tuning. Saving remains an explicit tune.save tuning action.

players 1
stage crossfeed
wait match
tune.reset tuning
tune tuning.player.gravity 3000.0
tune tuning.player.jump_launch_velocity -730.0
tune tuning.player.jump_acceleration -2250.0
tune tuning.player.jump_max_time 0.22
tune tuning.weapons.sniper.ammo_usage 0.30
tune tuning.weapons.mister.ammo_usage 0.02
tune tuning.projectiles.mist.delete_timer 2.0
echo crossfeed_coupled: P3 global compatibility movement, sniper cost 0.30, mister cost 0.02, mist lifetime 2s
