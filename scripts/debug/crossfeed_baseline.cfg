// P0 Crossfeed comparison: 2026-10-08 historical movement and original tool supply/lifetime.
// Run: ColourWars.exe +exec crossfeed_baseline
// Compare live: exec crossfeed_movement, exec crossfeed_lower or exec crossfeed_coupled.
// Live tuning is global; tune.reset tuning restores loaded defaults before other arenas.
// Inspect: tune.diff tuning. Saving remains an explicit tune.save tuning action.

players 1
stage crossfeed
wait match
tune.reset tuning
tune tuning.player.gravity 2000.0
tune tuning.player.jump_launch_velocity -600.0
tune tuning.player.jump_acceleration -1300.0
tune tuning.player.jump_max_time 0.35
tune tuning.weapons.sniper.ammo_usage 0.25
tune tuning.weapons.mister.ammo_usage 0.01
tune tuning.projectiles.mist.delete_timer 5.0
echo crossfeed_baseline: P0 historical movement, sniper cost 0.25, mister cost 0.01, mist lifetime 5s
