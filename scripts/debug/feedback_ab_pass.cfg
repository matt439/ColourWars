// Helper for review_feedback_ab: one visual ($1), rebuilt, then three paused frames on and off.
//
// The frames count Level updates after the countdown's GO, so they are the
// same simulation frame in every pass whatever the timescale. Each falls in a
// burst window of the seeded jump bots (seed 4242): checksum reports one
// live burst at t040, four at t096 and six at t156.

stage movement_course
visual $1
timescale 4
wait match
wait 40
exec feedback_ab_shot $1 t040
wait 56
exec feedback_ab_shot $1 t096
wait 60
exec feedback_ab_shot $1 t156
