// Helper for review_feedback_ab: one seeded match, then three paused frames on and off.
//
// The frames count Level updates after the countdown's GO, so they are the
// same simulation frames whatever the timescale. Each falls in a
// burst window of the seeded jump bots (seed 4242): checksum reports one
// live burst at t040, four at t096 and six at t156.

stage movement_course
timescale 4
wait match
wait 40
exec feedback_ab_shot t040
wait 56
exec feedback_ab_shot t096
wait 60
exec feedback_ab_shot t156
