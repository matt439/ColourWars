// Four paint bots on Close Quarters for 20 match seconds, then one paused screenshot with the paint overlay.
//
// Run:     ColourWars.exe +exec bots_4p +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\bots-4p-<time>\bots-4p-20s.png
// Log:     the checksum (seed 7 repeats it) and the coverage per team.
// Leaves:  the match paused on that frame; bots, seed and overlay off again.

screenshot.dir bots-4p-{time}
seed 7
bot 1 paint
players 4 paint
stage close_quarters
overlay.paint on
timescale 4
wait match
wait 20s
pause on
checksum
screenshot bots-4p-20s
timescale 1
overlay.paint off
bot off
seed off
screenshot.dir off
echo bots_4p: done
