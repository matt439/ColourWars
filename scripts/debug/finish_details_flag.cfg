// Helper for review_finish_details: presentation flag $1 off, the seeded match rebuilt and photographed as variant no_$2, then the flag on again.
//
// The restart rebuilds even a live-scoped flag's match, so every variant
// counts its frames from the same build. Turning the flag back on queues
// nothing: the next variant's restart (or the end's tune.reset) applies it.

tune $1 off restart
exec finish_details_pass no_$2
tune $1 on
