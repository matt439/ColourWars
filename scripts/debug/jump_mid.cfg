// Jump candidate "mid" for POL#3, on the Movement Course: held 166 high, 0.72 s airborne, tap 88.
//
// Run:     ColourWars.exe +exec jump_mid
// Compare: jump_baseline selects the 2026-10-08 historical movement profile.
// Restore: tune.reset tuning returns to loaded defaults; exec crossfeed_coupled selects P3 on Crossfeed.
// Keep:    tune.save tuning writes the candidate into game/content/tuning.json.

players 1
stage movement_course
wait match
tune.reset tuning
tune tuning.player.gravity 3000.0
tune tuning.player.jump_launch_velocity -700.0
tune tuning.player.jump_acceleration -1800.0
tune tuning.player.jump_max_time 0.22
echo jump_mid: held 166 high, 0.72 s airborne, tap 88
