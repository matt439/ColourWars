// Finish-review detail A/B: seeded four-player Crossfeed frames with every detail on, then once per presentation `enabled` flag with that flag off.
//
// Run:     ColourWars.exe +exec review_finish_details +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-finish-details-<time>\
//          <frame>-all_on.png, then <frame>-no_<detail>.png for each of the
//          ten flags, at frames t07s, t17s and t54s (match seconds after GO).
// Log:     `finish-details: pass <variant>` before each variant, then one
//          `checksum` line per frame. Every variant replays the same seeded
//          match from a fresh build, so each frame's checksum must be equal
//          across all eleven: the pictures differ only in presentation.
// Leaves:  the last variant's match running at timescale 1 with every detail
//          on (tune.reset presentation; tune.diff presentation is empty), and
//          the strip, the screenshot folder, the bots and the seed back as
//          they were. Not put back: the overlays (all off), feedback (on),
//          seat 4's sprayer and the match - Crossfeed with four seats.
// Pointer: the cursor marker is drawn at the real mouse pointer whenever it
//          is inside the window (seat 1 is the keyboard seat), so park the
//          pointer before running; scripts/check-finish-details.ps1 does.
// Accepts nothing: which details stay is the attended finish review (POL#24).

screenshot.dir review-finish-details-{time}
screenshot.strip off
seed 7
overlay none
feedback on
pause off
// Seat 1 (the keyboard seat) is a paint bot too. Seat 4 stands still with a
// sprayer, so its pane shows the details only a settled painter has: the
// idle drip and the figure's quiet motion.
bot 1 paint
players 4 paint
bot 4 idle
weapon 4 sprayer
stage crossfeed
timescale 4

exec finish_details_pass all_on
// The two hud flags and movement_feedback are live, the rest take a rebuild;
// every variant restarts, so all eleven replay the same match from its build.
exec finish_details_flag presentation.hud.cursor_marker.enabled hud_cursor_marker
exec finish_details_flag presentation.hud.teammate_marker.enabled hud_teammate_marker
exec finish_details_flag presentation.player_identity.enabled player_identity
exec finish_details_flag presentation.combat_feedback.enabled combat_feedback
exec finish_details_flag presentation.blocked_shot.enabled blocked_shot
exec finish_details_flag presentation.idle_drip.enabled idle_drip
exec finish_details_flag presentation.weapon_feedback.enabled weapon_feedback
exec finish_details_flag presentation.movement_feedback.enabled movement_feedback
exec finish_details_flag presentation.tool_motion.enabled tool_motion
exec finish_details_flag presentation.figure.quiet.enabled figure_quiet

// Back to how it was found.
tune.reset presentation
tune.diff presentation
feedback on
timescale 1
screenshot.strip on
screenshot.dir off
bot off
seed off
echo review_finish_details: done (3 frames x 11 variants)
