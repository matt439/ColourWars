// Helper for review_feedback_ab: one paused frame ($1 visual, $2 frame) with feedback on, then off.
//
// The second screenshot waits for the first (a script never runs past a
// pending shot), and both are taken between the same two updates.

pause on
checksum
feedback on
screenshot $1-$2-on
feedback off
screenshot $1-$2-off
feedback on
pause off
