// The shared Turbulence stations plus both ends of each mover on stage $1, one screenshot each.
//
// Run:     ColourWars.exe +exec turbulence_mover_station_tour turbulence_mover_trial +quit
//          (turbulence_station_tours runs every variant)
// Screens: %LOCALAPPDATA%\ColourWars\screens\turbulence-stations-$1-<time>\<station>.png
// Leaves:  one player on $1, god and the overlay off again.

exec station_tour_begin $1 turbulence-stations-$1

exec turbulence_station_tour_shared $1

// A mover has no dwell at its ends, so each endpoint is photographed paused
// as placed: the body at the station, the mover wherever its phase has it.
pause on
goto mover_outer_end_a
screenshot mover_outer_end_a
goto mover_outer_end_b
screenshot mover_outer_end_b
goto mover_inner_end_a
screenshot mover_inner_end_a
goto mover_inner_end_b
screenshot mover_inner_end_b
pause off

exec station_tour_end
echo turbulence_mover_station_tour $1: done (14 stations)
