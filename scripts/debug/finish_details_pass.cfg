// Helper for review_finish_details: three paused frames ($1 names the variant) of the match already queued or running.
//
// The frames count Level updates after the countdown's GO, so they are the
// same simulation frames whatever the timescale; each checksum is taken on
// the paused frame its screenshot shows. With seed 7 and seat 4 idle, t07s
// and t17s catch seat 4's drip, t17s a blocked shot and t54s a hit, and the
// teammate markers and the quiet figure are on screen in all three.

echo finish-details: pass $1
wait match
wait 7s
pause on
checksum
screenshot t07s-$1
pause off
wait 10s
pause on
checksum
screenshot t17s-$1
pause off
wait 37s
pause on
checksum
screenshot t54s-$1
pause off
