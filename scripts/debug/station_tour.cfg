// Every Movement Course station, one screenshot each, seat 1 at rest with the collision overlay.
//
// Run:     ColourWars.exe +exec station_tour +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\station-tour-<time>\<station>.png
// Leaves:  one player on the Movement Course, god and the overlay off again.

screenshot.dir station-tour-{time}
stage movement_course
players 1
timescale 4
wait match
// GO! stays up for a second after the countdown.
wait 1.2s
timescale 1
god on
overlay.collision on

// goto moves the cameras at once; two updates let the player settle on the
// surface before the shot.
goto drop_through
wait 2
screenshot drop_through
goto short_gap
wait 2
screenshot short_gap
goto long_gap
wait 2
screenshot long_gap
goto running_gap
wait 2
screenshot running_gap
goto low_ceiling
wait 2
screenshot low_ceiling
goto steps
wait 2
screenshot steps
goto high_step
wait 2
screenshot high_step
goto recovery_lane
wait 2
screenshot recovery_lane
goto spawn_a
wait 2
screenshot spawn_a
goto spawn_b
wait 2
screenshot spawn_b

overlay.collision off
god off
screenshot.dir off
echo station_tour: done (10 stations)
