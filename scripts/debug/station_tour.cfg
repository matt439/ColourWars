// Every Movement Course station, one screenshot each, seat 1 at rest with the collision overlay.
//
// Run:     ColourWars.exe +exec station_tour +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\station-tour-<time>\<station>.png
// Leaves:  one player on the Movement Course, god and the overlay off again.

exec station_tour_begin movement_course station-tour

// goto moves the cameras at once; two updates let the player settle on the
// surface before the shot.
goto drop_through
wait 2
screenshot drop_through
goto short_gap
wait 2
screenshot short_gap
goto long_gap
wait 2
screenshot long_gap
goto running_gap
wait 2
screenshot running_gap
goto low_ceiling
wait 2
screenshot low_ceiling
goto steps
wait 2
screenshot steps
goto high_step
wait 2
screenshot high_step
goto recovery_lane
wait 2
screenshot recovery_lane
goto workshop
wait 2
screenshot workshop

goto refill
wait 2
screenshot refill

goto sub
wait 2
screenshot sub

goto spawn_a
wait 2
screenshot spawn_a
goto spawn_b
wait 2
screenshot spawn_b

exec station_tour_end
echo station_tour: done (13 stations, including both spawns)
