// Every shared Turbulence station on stage $1, one screenshot each, seat 1 at rest with the collision overlay.
//
// Run:     ColourWars.exe +exec turbulence_station_tour turbulence_blockout +quit
//          (turbulence_station_tours runs every variant)
// Screens: %LOCALAPPDATA%\ColourWars\screens\turbulence-stations-$1-<time>\<station>.png
// Leaves:  one player on $1, god and the overlay off again.

screenshot.dir turbulence-stations-$1-{time}
stage $1
players 1
timescale 4
wait match
// GO! stays up for a second after the countdown.
wait 1.2s
timescale 1
god on
overlay.collision on

exec turbulence_station_tour_shared $1

overlay.collision off
god off
screenshot.dir off
echo turbulence_station_tour $1: done (10 stations)
