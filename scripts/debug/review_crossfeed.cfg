// Arena review pack for crossfeed: review_arena's frames, then every station on the one-player heavy frame.
//
// Run:     ColourWars.exe +exec review_crossfeed +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-crossfeed-<time>\, plus
//          station-<name>.png with the station labels on.
// Leaves:  as review_arena, with seat 1 at the last station and the
//          station overlay off again.

exec review_arena_frames crossfeed
// goto moves the camera at once, so each shot is the same paused frame.
overlay.stations on
goto lower_approach_a
screenshot station-lower_approach_a
goto lower_approach_b
screenshot station-lower_approach_b
goto under_mixer
screenshot station-under_mixer
goto upper_mixer
screenshot station-upper_mixer
goto side_bench_a
screenshot station-side_bench_a
goto side_bench_b
screenshot station-side_bench_b
goto home_a
screenshot station-home_a
goto home_b
screenshot station-home_b
overlay.stations off
exec review_arena_end
