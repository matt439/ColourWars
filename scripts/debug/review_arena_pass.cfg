// Helper for review_arena_frames: stage $1 with $2 paint-bot seats, a clean frame at GO and a heavy one 20 match seconds later.
//
// Seat 1 is a paint bot too, so the one-player pass has a paint source; the
// rebuild needs the clock running, and each shot is a paused frame.

pause off
bot 1 paint
players $2 paint
stage $1
timescale 4
wait match
pause on
checksum
screenshot $2p-clean
pause off
wait 20s
pause on
checksum
screenshot $2p-heavy
