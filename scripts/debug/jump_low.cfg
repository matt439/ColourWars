// Jump candidate "low" for POL#3, on the Movement Course: held 152 high, 0.68 s airborne, tap 72.
//
// Run:     ColourWars.exe +exec jump_low
// Compare: jump_baseline selects the 2026-10-08 historical movement profile.
// Restore: tune.reset tuning returns to loaded defaults; exec crossfeed_coupled selects P3 on Crossfeed.
// Keep:    tune.save tuning writes the candidate into game/content/tuning.json.

players 1
stage movement_course
wait match
tune.reset tuning
tune tuning.player.gravity 3200.0
tune tuning.player.jump_launch_velocity -650.0
tune tuning.player.jump_acceleration -2200.0
tune tuning.player.jump_max_time 0.20
echo jump_low: held 152 high, 0.68 s airborne, tap 72
