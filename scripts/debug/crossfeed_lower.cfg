// P2 Crossfeed comparison: experimental lower jump with coupled tool supply/lifetime.
// Run: ColourWars.exe +exec crossfeed_lower
// Compare live: exec crossfeed_baseline, exec crossfeed_movement or exec crossfeed_coupled.
// This lower jump cannot clear existing 200-unit arena climbs. Live tuning is global.
// Before other arenas: tune.reset tuning, or exec crossfeed_coupled for P3.
// Inspect: tune.diff tuning. Saving remains an explicit tune.save tuning action.

players 1
stage crossfeed
wait match
tune.reset tuning
tune tuning.player.gravity 3000.0
tune tuning.player.jump_launch_velocity -730.0
tune tuning.player.jump_acceleration -1800.0
tune tuning.player.jump_max_time 0.22
tune tuning.weapons.sniper.ammo_usage 0.30
tune tuning.weapons.mister.ammo_usage 0.02
tune tuning.projectiles.mist.delete_timer 2.0
echo crossfeed_lower: P2 experimental lower jump, sniper cost 0.30, mister cost 0.02, mist lifetime 2s. Reset global tuning before other arenas
