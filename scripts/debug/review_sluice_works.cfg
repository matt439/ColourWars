// Sluice Works: two and four panes at GO, after 20 seconds of paint, and at the gate and bridge.
// Run: ColourWars.exe +exec review_sluice_works +quit
// Screens: %LOCALAPPDATA%\ColourWars\screens\review-sluice_works-<time>\

screenshot.dir review-sluice_works-{time}
screenshot.strip off
seed 7
overlay none

exec review_arena_pass sluice_works 2
// Put both panes on the approaches to the same gate, with the clock still held.
goto gate_approach_a 1
goto gate_approach_b 2
screenshot 2p-gate

exec review_arena_pass sluice_works 4
// Compare both gate faces with the upper crossing and its approach at four-pane scale.
goto gate_approach_a 1
goto gate_approach_b 2
goto bridge_centre 3
goto inspection_landing_a 4
screenshot 4p-routes

exec review_arena_end
