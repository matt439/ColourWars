// Study B helper: stage $1 with $2 paint-bot seats, a clean frame at GO and a heavy one 20 match seconds later, named $1-$2p-<clean|heavy>-$3.
//
// The same shape as review_arena_pass: seat 1 is a paint bot too, the rebuild
// needs the clock running, and each shot is a paused frame with its checksum
// logged just before it, after a `study-b: shot <name>` marker.

pause off
bot 1 paint
players $2 paint
stage $1
timescale 4
wait match
pause on
echo study-b: shot $1-$2p-clean-$3
checksum
screenshot $1-$2p-clean-$3
pause off
wait 20s
pause on
echo study-b: shot $1-$2p-heavy-$3
checksum
screenshot $1-$2p-heavy-$3
