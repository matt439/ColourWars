// Study B helper: the session settings every capture run starts with. Seed $1.
//
// Run by scripts/studies/capture-study-b.ps1, which copies this file into the
// isolated profile's debug folder; not shipped in scripts/debug/.
// The cursor marker follows the real mouse pointer, so it is off for every
// shot: where the pointer sits is not part of the stimulus.

screenshot.dir studyb
screenshot.strip off
seed $1
overlay none
feedback on
tune presentation.hud.cursor_marker.enabled off
