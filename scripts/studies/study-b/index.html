<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColourWars picture study</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.45 system-ui, "Segoe UI", sans-serif; color: #1b1b1b; background: #f4f4f1; }
  header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #ccc; }
  header .title { font-weight: 600; white-space: nowrap; }
  #progress { flex: 1; height: 12px; background: #e3e3e3; border-radius: 6px; overflow: hidden; }
  #progress-fill { height: 100%; width: 0; background: #3b6fb6; transition: width 0.2s; }
  #progress-text { min-width: 70px; text-align: right; font-size: 14px; color: #555; }
  /* The layout constants in LAYOUT below must match these paddings and widths. */
  main { padding: 12px 16px; }
  .panel { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 20px 24px; margin-bottom: 16px; }
  .panel.narrow { max-width: 760px; margin-left: auto; margin-right: auto; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  h2 { font-size: 20px; margin: 0 0 10px; }
  .prompt { font-size: 20px; font-weight: 600; margin: 0 0 10px; }
  button { font: inherit; padding: 10px 22px; border: 1px solid #2e5a96; border-radius: 5px; background: #3b6fb6; color: #fff; cursor: pointer; margin: 4px 8px 4px 0; }
  button.secondary { background: #fff; color: #2e5a96; }
  button.on { outline: 4px solid #e0115f; }
  button:disabled { background: #b9c6d8; border-color: #b9c6d8; cursor: default; color: #fff; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  /* A trial: the picture on the left at a whole-number scale, every control in a fixed-width column on the right. */
  .trial { display: flex; gap: 16px; align-items: flex-start; }
  .trial .area { flex: none; }
  .trial .side { flex: 0 0 300px; width: 300px; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 14px; }
  .trial .side button { display: block; width: 100%; margin: 6px 0; }
  .stage { position: relative; display: inline-block; line-height: 0; cursor: crosshair; border: 1px solid #999; }
  .stage img, .stage canvas { display: block; image-rendering: pixelated; }
  .marker { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 3px solid #e0115f; border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 2px #fff; }
  .shown-label { font-size: 22px; font-weight: 700; margin: 6px 0; }
  textarea { width: 100%; min-height: 120px; font: inherit; padding: 8px; }
  input[type=text], input[type=number] { font: inherit; padding: 6px 8px; }
  .muted { color: #666; font-size: 15px; }
  .warn { color: #8a4b00; }
  .error { color: #a00; font-weight: 600; }
  .crop-wrap { display: flex; justify-content: center; margin: 12px 0; }
  .crop-wrap canvas { border: 4px solid #e0115f; image-rendering: pixelated; }
  .team-buttons button { min-width: 160px; font-size: 19px; }
  ul.notes { margin: 6px 0 0 20px; padding: 0; }
  label.block { display: block; margin: 10px 0 4px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <span class="title">Picture study</span>
  <div id="progress"><div id="progress-fill"></div></div>
  <span id="progress-text"></span>
  <button id="export-partial" class="secondary hidden" title="Save what has been recorded so far">Save results so far</button>
</header>
<main id="main"></main>

<script>
'use strict';
/*
 * ColourWars Study B test page. See scripts/studies/README.md.
 *
 * The page is opened from disk (file://). Browsers refuse fetch() of local
 * files there, so the experimenter picks the stimulus folder with a directory
 * picker and every image is shown through an object URL. Nothing is sent
 * anywhere; results leave the page only through the Export download.
 *
 * Everything above the "user interface" line is pure logic with no DOM use,
 * so a Node check can load it (see selftest.py).
 */
var StudyB = (function () {
  var FORMAT = 'colourwars-study-b-results';
  var FORMAT_VERSION = 2;
  var BASELINE = 'V0';
  var TESTS = ['paired', 'bug', 'stand', 'find'];
  // Balanced (Williams) Latin square for four tests. The row is (participant number - 1) mod 4,
  // so consecutive participant numbers fill the rows evenly.
  var LATIN = [[0, 1, 3, 2], [1, 2, 0, 3], [2, 3, 1, 0], [3, 0, 2, 1]];
  var DEFAULT_CAPS = { paired: 8, bug: 2, stand: 2, find: 3, team: 6 };
  // Keys a seat or crop may not use in "where": they must hold in every variant.
  var VARIANT_KEYS = ['variant', 'variants', 'path'];

  // FNV-1a over UTF-16 code units, then a murmur3 finaliser.
  function hashString(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0;
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0;
    h ^= h >>> 16;
    return h >>> 0;
  }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(list, rng) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // The same frame in every variant shares a context. analyse.py builds the same key.
  function contextKey(img) {
    return [img.resolution, img.players, img.palette, img.shot, img.identity_cues].map(function (v) {
      return v === null || v === undefined ? '' : String(v);
    }).join('|');
  }

  function cleanPath(p) {
    return String(p).replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
  }

  function validRect(r) {
    return Array.isArray(r) && r.length === 4 && r.every(function (v) { return typeof v === 'number' && v >= 0 && v <= 1; }) &&
      r[2] > r[0] && r[3] > r[1];
  }

  // Same matching as region_applies in analyse.py.
  function regionApplies(where, img) {
    where = where || {};
    return Object.keys(where).every(function (k) {
      var want = where[k];
      if (k === 'variants') return Array.isArray(want) && want.indexOf(img.variant) >= 0;
      if (k === 'path') return img.path === cleanPath(want);
      return Object.prototype.hasOwnProperty.call(img, k) && img[k] === want;
    });
  }

  function paletteHalves(palette) {
    var h = palette ? String(palette).split('_') : [];
    return h.length === 2 ? h : null;
  }

  // A seat or crop names its team literally ("team") or as a half of the palette name ("side": 0 or 1).
  function teamFor(entry, img) {
    if (typeof entry.team === 'string') return entry.team;
    var halves = paletteHalves(img.palette);
    if ((entry.side === 0 || entry.side === 1) && halves) return halves[entry.side];
    return null;
  }

  // available: function(path) -> bool, whether the picked folder holds that file.
  function normaliseManifest(manifest, available) {
    var warnings = [];
    var images = [];
    var seen = {};
    var list = (manifest && Array.isArray(manifest.images)) ? manifest.images : [];
    if (!list.length) warnings.push('The manifest has no "images" list.');
    list.forEach(function (raw, i) {
      if (!raw || typeof raw.path !== 'string' || typeof raw.variant !== 'string') {
        warnings.push('Image ' + i + ' has no path or variant; skipped.');
        return;
      }
      var path = cleanPath(raw.path);
      if (seen[path]) { warnings.push('Duplicate path ' + path + '; skipped.'); return; }
      if (available && !available(path)) { warnings.push('Missing file ' + path + '; skipped.'); return; }
      seen[path] = true;
      images.push({
        variant: raw.variant,
        resolution: raw.resolution === undefined ? null : String(raw.resolution),
        players: raw.players === undefined ? null : Number(raw.players),
        palette: raw.palette === undefined ? null : String(raw.palette),
        stage: raw.stage === undefined ? null : String(raw.stage),
        shot: raw.shot === undefined ? null : String(raw.shot),
        frame: raw.frame === undefined ? null : String(raw.frame),
        identity_cues: raw.identity_cues === undefined ? null : Boolean(raw.identity_cues),
        path: path
      });
    });
    if (manifest && (manifest.crops || list.some(function (r) { return r && r.seats; }))) {
      warnings.push('The manifest carries crops or seats. They are ignored: seats and crops live in regions.json, which survives a recapture.');
    }
    images.sort(function (a, b) { return a.path < b.path ? -1 : a.path > b.path ? 1 : 0; });
    return { images: images, warnings: warnings };
  }

  // Reads the experimenter's regions file: seats and crops for the page, and a check
  // that every region matches at least one loaded image.
  function normaliseRegions(doc, images) {
    var warnings = [], seats = [], crops = [];
    var list = (doc && Array.isArray(doc.regions)) ? doc.regions : [];
    if (doc && !Array.isArray(doc.regions)) warnings.push('regions.json has no "regions" list.');
    list.forEach(function (r, i) {
      var label = 'Region ' + i + (r && r.id ? ' (' + r.id + ')' : '');
      if (!r || !validRect(r.rect)) { warnings.push(label + ': rect must be [x0, y0, x1, y1] in 0..1; ignored.'); return; }
      var where = r.where || {};
      if (!images.some(function (img) { return regionApplies(where, img); })) {
        warnings.push(label + ': its "where" matches no loaded image, so it can score nothing.');
      }
      if (r.kind === 'seat' || r.kind === 'crop') {
        var bad = VARIANT_KEYS.filter(function (k) { return Object.prototype.hasOwnProperty.call(where, k); });
        if (bad.length) { warnings.push(label + ': a ' + r.kind + ' must hold in every variant, so its "where" may not use ' + bad.join(', ') + '; ignored.'); return; }
      }
      if (r.kind === 'seat') {
        if (typeof r.seat !== 'number' || Math.floor(r.seat) !== r.seat) { warnings.push(label + ': a seat needs an integer "seat"; ignored.'); return; }
        seats.push({ seat: r.seat, team: r.team, side: r.side, where: where, rect: r.rect.slice() });
      } else if (r.kind === 'crop') {
        if (typeof r.id !== 'string') { warnings.push(label + ': a crop needs an "id"; ignored.'); return; }
        if (typeof r.team !== 'string' && r.side !== 0 && r.side !== 1) { warnings.push(label + ': a crop needs "team" or "side" (0 or 1); ignored.'); return; }
        crops.push({ id: r.id, team: r.team, side: r.side, where: where, rect: r.rect.slice(),
          options: Array.isArray(r.options) ? r.options.map(String) : null });
      }
    });
    return { seats: seats, crops: crops, warnings: warnings, count: list.length };
  }

  function prepare(manifest, available, regionsDoc) {
    var m = normaliseManifest(manifest, available);
    var r = normaliseRegions(regionsDoc, m.images);
    return { images: m.images, seats: r.seats, crops: r.crops, regions_count: r.count,
      has_regions: !!regionsDoc, warnings: m.warnings.concat(r.warnings) };
  }

  function variantsOf(images) {
    var set = {};
    images.forEach(function (img) { set[img.variant] = true; });
    return Object.keys(set).sort();
  }

  function groupBy(list, keyFn) {
    var out = {};
    list.forEach(function (x) { var k = keyFn(x); (out[k] = out[k] || []).push(x); });
    return out;
  }

  function imageInfo(img) {
    return {
      variant: img.variant, path: img.path, context: contextKey(img), resolution: img.resolution, players: img.players,
      palette: img.palette, stage: img.stage, shot: img.shot, frame: img.frame, identity_cues: img.identity_cues
    };
  }

  // Contexts that have an image in every variant, as units { key, byVariant }.
  function completeContexts(images, variants, filter) {
    var groups = groupBy(images.filter(filter), contextKey);
    var out = [];
    Object.keys(groups).sort().forEach(function (k) {
      var byVariant = {};
      groups[k].forEach(function (img) { if (!byVariant[img.variant]) byVariant[img.variant] = img; });
      if (variants.every(function (v) { return byVariant[v]; })) out.push({ key: k, byVariant: byVariant });
    });
    return out;
  }

  // A fixed order for the stimulus set: the same for every participant, so the
  // rotation below gives every unit to every variant over consecutive participants.
  function setOrder(units, salt) {
    var rng = mulberry32(hashString('set|' + salt + '|' + units.map(function (u) { return u.key; }).join(',')));
    return shuffle(units, rng);
  }

  // Unit i goes to variant (i + rotation) mod K. Each participant sees each unit once, in one
  // variant; over K consecutive participant numbers each unit is shown once in every variant.
  function rotate(units, variants, rotation) {
    return units.map(function (u, i) { return { unit: u, variant: variants[(i + rotation) % variants.length] }; });
  }

  function take(list, from, count) {
    var out = [];
    for (var i = 0; i < count && list.length; i++) out.push(list[(from + i) % list.length]);
    return out;
  }

  function seatLabel(seat) {
    return 'Player ' + seat.seat + (seat.team ? ' (' + seat.team + ' team)' : '');
  }

  function buildPlan(norm, participantId, participantNumber, capsIn) {
    var caps = {};
    Object.keys(DEFAULT_CAPS).forEach(function (k) {
      caps[k] = (capsIn && capsIn[k] !== undefined) ? Math.max(0, Math.floor(capsIn[k])) : DEFAULT_CAPS[k];
    });
    var n = Math.floor(participantNumber);
    if (!(n >= 1)) throw new Error('The participant number must be a whole number from 1.');
    var rng = mulberry32(hashString('study-b|' + participantId + '|' + n));
    var orderRow = (n - 1) % 4;
    var order = LATIN[orderRow].map(function (i) { return TESTS[i]; });
    var images = norm.images;
    var variants = variantsOf(images);
    var K = variants.length;
    var rotation = K ? (n - 1) % K : 0;
    var others = variants.filter(function (v) { return v !== BASELINE; });
    var notes = [];
    if (variants.indexOf(BASELINE) < 0) notes.push('No V0 images: nothing to compare against.');

    // First impressions: one image per variant, same context where possible.
    var byContext = groupBy(images, contextKey);
    var bestScore = -1, best = [];
    Object.keys(byContext).sort().forEach(function (k) {
      var vs = variantsOf(byContext[k]);
      var score = vs.length * 4 + (vs.indexOf(BASELINE) >= 0 ? 2 : 0) + (byContext[k][0].identity_cues !== false ? 1 : 0);
      if (score > bestScore) { bestScore = score; best = [k]; } else if (score === bestScore) best.push(k);
    });
    var chosenContext = best.length ? best[Math.floor(rng() * best.length)] : null;
    var impressions = [];
    variants.forEach(function (v) {
      var same = (byContext[chosenContext] || []).filter(function (img) { return img.variant === v; });
      var pool = same.length ? same : images.filter(function (img) { return img.variant === v; });
      var img = pool[Math.floor(rng() * pool.length)];
      impressions.push({ test: 'impressions', image: img });
    });
    impressions = shuffle(impressions, rng);

    // Paired choice: V0 against each variant in the same context. One picture at a time;
    // the participant switches between A and B.
    var paired = [];
    others.forEach(function (v) {
      var pairs = [];
      images.forEach(function (img) {
        if (img.variant !== v) return;
        var base = (byContext[contextKey(img)] || []).filter(function (b) { return b.variant === BASELINE; });
        if (base.length) pairs.push({ variant: img, baseline: base[0] });
      });
      if (!pairs.length) notes.push('Paired choice: no V0 image shares a context with ' + v + '.');
      shuffle(pairs, rng).slice(0, caps.paired).forEach(function (p) {
        paired.push({ test: 'paired', image: p.variant, baseline: p.baseline, first: rng() < 0.5 ? BASELINE : v });
      });
    });
    paired = shuffle(paired, rng);

    // Find the bug and standable: contexts that exist in every variant, rotated over variants.
    var singles = completeContexts(images, variants, function (img) { return img.identity_cues !== false; });
    if (!singles.length) singles = completeContexts(images, variants, function () { return true; });
    singles = setOrder(singles, 'singles');
    var nb = Math.min(caps.bug * K, singles.length), ns = Math.min(caps.stand * K, singles.length);
    if (singles.length < Math.max(caps.bug, caps.stand) * K) {
      notes.push('Only ' + singles.length + ' context(s) exist in every variant; find-the-bug and standable show fewer than their limits.');
    }
    if (nb + ns > singles.length) notes.push('The standable test reuses some find-the-bug contexts.');
    var bug = rotate(take(singles, 0, nb), variants, rotation).map(function (a) {
      return { test: 'bug', image: a.unit.byVariant[a.variant] };
    });
    var stand = rotate(take(singles, nb, ns), variants, rotation).map(function (a) {
      return { test: 'stand', image: a.unit.byVariant[a.variant] };
    });
    bug = shuffle(bug, rng);
    stand = shuffle(stand, rng);

    // Find the player: 4-player frames with cues off, each context with one fixed seat.
    var findUnits = setOrder(completeContexts(images, variants, function (img) {
      return img.players === 4 && img.identity_cues === false;
    }), 'find').slice(0, caps.find * K);
    var unscored = 0;
    findUnits.forEach(function (u, i) {
      var ref = u.byVariant[variants[0]];
      var bySeat = {};
      norm.seats.forEach(function (s) { if (!bySeat[s.seat] && regionApplies(s.where, ref)) bySeat[s.seat] = s; });
      var nums = Object.keys(bySeat).map(Number).sort(function (a, b) { return a - b; });
      if (nums.length) {
        var s = bySeat[nums[i % nums.length]];
        u.seat = { seat: s.seat, team: teamFor(s, ref), rect: s.rect.slice() };
      } else {
        u.seat = { seat: 1 + (i % 4), team: null, rect: null };
        unscored++;
      }
    });
    if (!findUnits.length) notes.push('Find the player: no 4-player frames with identity cues off in every variant; skipped.');
    if (unscored) notes.push('Find the player: ' + unscored + ' context(s) have no seat regions, so those clicks cannot be scored and the find rule will give NO DATA.');
    var find = rotate(findUnits, variants, rotation).map(function (a) {
      return { test: 'find', image: a.unit.byVariant[a.variant], seat: a.unit.seat, prompt: 'Click on ' + seatLabel(a.unit.seat) + '.' };
    });
    find = shuffle(find, rng);

    // Which team: each crop in each context it names, rotated over variants like the rest.
    var cropUnits = [];
    norm.crops.forEach(function (c) {
      completeContexts(images, variants, function (img) { return regionApplies(c.where, img); }).forEach(function (g) {
        var ref = g.byVariant[variants[0]];
        var truth = teamFor(c, ref);
        var options = c.options || paletteHalves(ref.palette);
        if (!truth || !options || options.indexOf(truth) < 0) {
          notes.push('Crop ' + c.id + ' in ' + g.key + ': its team is not one of the answer options; skipped.');
          return;
        }
        cropUnits.push({ key: c.id + '@' + g.key, crop: c, byVariant: g.byVariant, truth: truth, options: options });
      });
    });
    var team = [];
    if (!cropUnits.length) {
      notes.push('Team ID on crops: regions.json has no usable crops, so it is skipped and the minimum study cannot complete.');
    } else {
      team = rotate(setOrder(cropUnits, 'team').slice(0, caps.team * K), variants, rotation).map(function (a) {
        return { test: 'team', image: a.unit.byVariant[a.variant], crop_id: a.unit.crop.id, crop: a.unit.crop.rect,
          truth: a.unit.truth, options: shuffle(a.unit.options, rng) };
      });
      team = shuffle(team, rng);
    }

    var blocks = [{ test: 'practice', trials: [{ test: 'practice' }] }];
    if (impressions.length) blocks.push({ test: 'impressions', trials: impressions });
    order.forEach(function (t) {
      var trials = { paired: paired, bug: bug, stand: stand, find: find }[t];
      if (trials.length) blocks.push({ test: t, trials: trials });
      if (t === 'find' && team.length) blocks.push({ test: 'team', trials: team });
    });
    var total = 0;
    blocks.forEach(function (b) { total += b.trials.length; });
    return { participant: participantId, participant_number: n, order: order, order_row: orderRow,
      variants: variants, rotation: rotation, caps: caps, blocks: blocks, total: total, notes: notes };
  }

  // The largest whole number of device pixels per image pixel that fits the space
  // (CSS pixels at devicePixelRatio dpr). Below 1:1 it does not fit; the frame is
  // then shown at 1:1 anyway, never shrunk, and the trial records fits: false.
  function displayFit(w, h, availW, availH, dpr) {
    dpr = dpr || 1;
    var s = Math.floor(Math.min(availW * dpr / w, availH * dpr / h) + 1e-9);
    var fits = s >= 1;
    if (!fits) s = 1;
    return { scale: s, css_w: w * s / dpr, css_h: h * s / dpr, dpr: dpr, natural: [w, h], fits: fits };
  }

  // Turns a trial and the participant's response into the exported record.
  function recordFor(trial, response, index) {
    var r = { test: trial.test, index: index };
    if (trial.image) {
      var info = imageInfo(trial.image);
      Object.keys(info).forEach(function (k) { r[k] = info[k]; });
    }
    r.rt_ms = response.rt_ms === undefined || response.rt_ms === null ? null : Math.round(response.rt_ms);
    r.display = response.display || null;
    switch (trial.test) {
      case 'practice':
        r.click = response.click || null; r.hit = !!response.hit; break;
      case 'impressions':
        r.text = String(response.text || ''); break;
      case 'paired':
        r.baseline_path = trial.baseline.path;
        r.first = trial.first;                     // the variant shown first, as picture A
        r.chosen = response.chosen;                // 'V0' or the variant name
        r.chose_variant = response.chosen === trial.image.variant;
        r.changes = response.changes || 0;
        r.switches = response.switches || 0;
        r.why = String(response.why || '');
        break;
      case 'bug':
        r.no_bug = !!response.no_bug;
        r.click = response.no_bug ? null : response.click;
        break;
      case 'stand':
        r.clicks = (response.clicks || []).slice();
        break;
      case 'find':
        r.seat = trial.seat.seat;
        r.seat_team = trial.seat.team || null;
        r.seat_rect = trial.seat.rect || null;
        r.prompt = trial.prompt;
        r.click = response.click;
        break;
      case 'team':
        r.crop_id = trial.crop_id;
        r.crop = trial.crop.slice();
        r.truth = trial.truth;
        r.options = trial.options.slice();
        r.answer = response.answer;
        r.correct = response.answer === trial.truth;
        break;
    }
    return r;
  }

  function newResults(plan, meta) {
    return {
      format: FORMAT, version: FORMAT_VERSION,
      participant: plan.participant, participant_number: plan.participant_number,
      order: plan.order, order_row: plan.order_row, variants: plan.variants, rotation: plan.rotation, caps: plan.caps,
      consent: !!meta.consent, started: meta.started || null, finished: null, complete: false,
      manifest_images: meta.manifest_images || 0, plan_notes: plan.notes.slice(), load_warnings: (meta.warnings || []).slice(),

    document.getElementById('pickA').onclick = function () { pick('A'); };
    document.getElementById('pickB').onclick = function () { pick('B'); };
    document.getElementById('next').onclick = function () {
      record(trial, { chosen: names[chosen], changes: changes, switches: switches, rt_ms: rt, display: disp,
        why: document.getElementById('why').value.trim() });
    };
  }

  function showBug(trial) {
    var area = trialLayout('<p class="prompt">Click on the rendering bug, or press "No bug".</p>' +
      '<button class="secondary" id="none">No bug</button><button id="next" disabled>Next</button>' +
      '<p class="muted">Click again to move your mark.</p>');
    var t0 = null, rt = null, click = null, marker = null, disp = null;
    imageStage(area, trial.image.path, function (stage, img, t, f) {
      t0 = t; disp = f;
      stage.onclick = function (ev) {
        click = normPoint(ev, img);
        if (rt === null) rt = performance.now() - t0;
        if (marker) marker.remove();
        marker = addMarker(stage, click);
        document.getElementById('next').disabled = false;
      };
    });
    document.getElementById('none').onclick = function () {
      if (t0 === null) return;
      record(trial, { no_bug: true, rt_ms: performance.now() - t0, display: disp });
    };
    document.getElementById('next').onclick = function () { record(trial, { no_bug: false, click: click, rt_ms: rt, display: disp }); };
  }

  function showStand(trial) {
    var area = trialLayout('<p class="prompt">Click on every thing you could stand on.</p>' +
      '<button class="secondary" id="undo" disabled>Undo last click</button><button id="next">Done</button>' +
      '<p class="muted" id="count">0 clicks</p>');
    var t0 = null, clicks = [], markers = [], disp = null;
    function update() {
      document.getElementById('count').textContent = clicks.length + (clicks.length === 1 ? ' click' : ' clicks');
      document.getElementById('undo').disabled = clicks.length === 0;
    }
    imageStage(area, trial.image.path, function (stage, img, t, f) {
      t0 = t; disp = f;
      stage.onclick = function (ev) {
        var p = normPoint(ev, img);
        p.t_ms = Math.round(performance.now() - t0);
        clicks.push(p);
        markers.push(addMarker(stage, p));
        update();
      };
    });
    document.getElementById('undo').onclick = function () { clicks.pop(); markers.pop().remove(); update(); };
    document.getElementById('next').onclick = function () {
      if (t0 === null) return;
      record(trial, { clicks: clicks, rt_ms: performance.now() - t0, display: disp });
    };
  }

  function showFind(trial) {
    var area = trialLayout('<p class="prompt">' + esc(trial.prompt) + '</p><p class="muted">Your first click counts.</p>');
    imageStage(area, trial.image.path, function (stage, img, t0, f) {
      stage.onclick = function (ev) {
        stage.onclick = null;
        var p = normPoint(ev, img);
        var rt = performance.now() - t0;
        addMarker(stage, p);
        setTimeout(function () { record(trial, { click: p, rt_ms: rt, display: f }); }, 250);
      };
    });
  }

  function showTeam(trial) {
    main.innerHTML = '<div class="panel"><p class="prompt">Which team is the outlined figure on?</p>' +
      '<div class="crop-wrap" id="area"></div><div class="row team-buttons" id="btns"></div></div>';
    var img = new Image();
    img.onload = function () {
      var r = trial.crop;
      var sx = Math.round(r[0] * img.naturalWidth), sy = Math.round(r[1] * img.naturalHeight);
      var sw = Math.max(1, Math.round((r[2] - r[0]) * img.naturalWidth)), sh = Math.max(1, Math.round((r[3] - r[1]) * img.naturalHeight));
      // Whole device pixels per image pixel, up to about 480 CSS pixels on the long side.
      var dpr = window.devicePixelRatio || 1;
      var scale = Math.max(1, Math.floor(Math.min(480 * dpr / sw, 480 * dpr / sh)));
      var c = document.createElement('canvas');
      c.width = sw * scale; c.height = sh * scale;
      c.style.width = (c.width / dpr) + 'px'; c.style.height = (c.height / dpr) + 'px';
      var g = c.getContext('2d');
      g.imageSmoothingEnabled = false;
      g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      document.getElementById('area').appendChild(c);
      var disp = { scale: scale, css_w: c.width / dpr, css_h: c.height / dpr, dpr: dpr, natural: [sw, sh], fits: true,
        window: [window.innerWidth, window.innerHeight] };
      var t0 = performance.now();
      var btns = document.getElementById('btns');
      trial.options.forEach(function (o) {
        var b = document.createElement('button');
        b.textContent = o.charAt(0).toUpperCase() + o.slice(1);
        b.onclick = function () { record(trial, { answer: o, rt_ms: performance.now() - t0, display: disp }); };
        btns.appendChild(b);
      });
    };
    img.src = urlFor(trial.image.path);
  }

  function finish() {
    results.complete = true;
    results.finished = new Date().toISOString();
    setProgress();
    main.innerHTML = '<div class="panel narrow"><h1>Thank you</h1><p>That is everything. Please hand the computer back to the researcher.</p>' +
      '<hr><p class="muted">For the researcher: save the results file now. It is downloaded to this computer only. ' +
      'Keep it outside the repository.</p>' +
      (plan.notes.length ? '<p class="muted">Notes from this run:</p><ul class="notes muted">' +
        plan.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') +
      '<div class="row"><button id="exp">Export results (JSON)</button><button class="secondary" id="again">Next participant</button></div></div>';
    document.getElementById('exp').onclick = exportResults;
    document.getElementById('again').onclick = function () {
      if (!exported && !confirm('The results have not been exported. Discard them?')) return;
      nextNumber = String(plan.participant_number + 1);
      results = null; plan = null; exported = false; partialBtn.classList.add('hidden');
      showSetup();
    };
  }

  showSetup();
  setProgress();
})();
</script>
</body>
</html>
