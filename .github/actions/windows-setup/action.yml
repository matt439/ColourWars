name: Windows C++ setup
description: Share vcpkg binaries, runner diagnostics and the MSVC environment across Windows jobs.
runs:
  using: composite
  steps:
    - name: Point at the runner's vcpkg
      id: vcpkg
      shell: pwsh
      run: |
        "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
        # Runners differ by up to 2x; name the hardware a slow run drew.
        Get-CimInstance Win32_Processor | ForEach-Object { "$($_.Name), $($_.NumberOfLogicalProcessors) logical" }

    # Package hashes include the compiler, which moves with the runner image.
    # Both workflows must use this key so nightly warms master's cache for PRs.
    - name: Cache vcpkg binaries
      uses: actions/cache@v6
      with:
        path: ~/AppData/Local/vcpkg/archives
        key: colourwars-vcpkg-${{ steps.vcpkg.outputs.image }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: colourwars-vcpkg-${{ steps.vcpkg.outputs.image }}-

    - name: Set up MSVC
      shell: pwsh
      run: ./scripts/ci/export-msvc-environment.ps1
