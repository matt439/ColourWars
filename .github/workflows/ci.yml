# Build against the pinned engine, with accepted audio and its optional fallback.
# Engine tests and benchmarks run in Labrador's CI; this consumer has no ctest targets.

name: build

on:
  push:
    branches: [master, 'review-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [x64-debug, x64-release]

    # Ninja builds need the MSVC environment supplied by vcvars64.bat.
    defaults:
      run:
        shell: cmd

    steps:
      # Include Labrador and its nested dependencies.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMakePresets.json requires VCPKG_ROOT to locate the toolchain.
      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Reuse dependency binaries across configure steps.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Find vcvars64
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do echo VCVARS=%%i\VC\Auxiliary\Build\vcvars64.bat>> %GITHUB_ENV%

      - name: Configure
        run: |
          call "%VCVARS%"
          cmake --preset ${{ matrix.preset }}

      - name: Audio publication and staging checks
        shell: pwsh
        run: python -m unittest discover -s scripts/audio -p test_runtime_bank.py

      # Building also runs Labrador's include-boundary check.
      - name: Build
        run: |
          call "%VCVARS%"
          cmake --build --preset ${{ matrix.preset }}

      - name: Consumer acceptance checks
        run: |
          call "%VCVARS%"
          pwsh -NoProfile -File scripts/run-acceptance.ps1 -Preset ${{ matrix.preset }} -SkipBuild

      # Hidden, scripted correctness checks. Debug can fall back to WARP on
      # GPU-less runners; this establishes no hardware or performance acceptance.
      - name: Movement feedback rendering checks
        if: matrix.preset == 'x64-debug'
        timeout-minutes: 20
        run: |
          call "%VCVARS%"
          pwsh -NoProfile -File scripts/check-movement-feedback.ps1 -Preset x64-debug -SkipBuild -AllowSoftwareAdapter

      # Keep structured diagnostics on failure without uploading the probe's
      # executable, objects or large raw PPM capture matrix.
      - name: Upload movement feedback evidence
        if: always() && matrix.preset == 'x64-debug'
        uses: actions/upload-artifact@v4
        with:
          name: movement-feedback-${{ matrix.preset }}
          path: |
            out/validation/movement-feedback/**/*.json
            out/validation/movement-feedback/**/*.csv
            out/validation/movement-feedback/**/*.log
            out/validation/movement-feedback/**/*.err
          if-no-files-found: ignore
          retention-days: 7

      - name: Level editor acceptance
        run: |
          call "%VCVARS%"
          cmake --build --preset ${{ matrix.preset }} --target colourwars_editor_acceptance
          pwsh -NoProfile -File scripts/check-level-editor.ps1 -Preset ${{ matrix.preset }} -SkipBuild

      - name: Package Release
        if: matrix.preset == 'x64-release'
        run: |
          call "%VCVARS%"
          cmake --build --preset x64-release --target package

      - name: Extract and inspect Release package
        if: matrix.preset == 'x64-release'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "ColourWars-release"
          Expand-Archive -LiteralPath "out/build/x64-release/packages/ColourWars-windows-x64.zip" -DestinationPath $destination
          $package = Join-Path $destination "ColourWars-windows-x64"
          $files = Get-ChildItem -LiteralPath $package -File -Recurse
          if ($files | Where-Object {
            $_.Extension -in '.wav', '.mp3', '.ogg', '.pdb' -or
            ($_.Extension -eq '.xwb' -and $_.FullName -ne (Join-Path $package 'sounds/paint_exe.xwb')) -or
            ($_.Extension -eq '.exe' -and $_.Name -ne 'ColourWars.exe')
          }) { throw "Development files or unreviewed audio leaked into the package" }
          foreach ($required in 'ColourWars.exe', 'DirectXTK.dll', 'xaudio2_9redist.dll',
            'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'build-info.txt',
            'sounds/paint_exe.json', 'sounds/paint_exe.xwb',
            'licenses/paint_exe/PROVENANCE.md', 'licenses/paint_exe/CC0-1.0.txt',
            'licenses/paint_exe/runtime-bank.json') {
            if (-not (Test-Path -LiteralPath (Join-Path $package $required))) {
              throw "Package is missing $required"
            }
          }
          $receipt = Get-Content -Raw scripts/audio/runtime-bank.json | ConvertFrom-Json
          if ((Get-FileHash -LiteralPath (Join-Path $package 'sounds/paint_exe.xwb')).Hash -ine $receipt.sha256) {
            throw 'Packaged bank differs from the accepted publication'
          }
          # The developer console is Debug-only. Its polymorphic classes would
          # leave MSVC RTTI names in the binary if any of it were linked.
          # Keep this list aligned with scripts/acceptance/debug_console.cpp.
          $exe = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes(
            (Join-Path $package 'ColourWars.exe')))
          foreach ($name in '.?AVDebugConsoleState@@', '.?AVDebugRegistry@@', '.?AVLambdaCommand@@',
              '.?AVDebugMenuPage@@', '.?AVNumberVariable@@',
              '.?AVBot@@', '.?AVPaintBot@@', '.?AVBotDriver@@', '.?AVReplayRecorder@@',
              '.?AVReplayPlayer@@', '.?AVTuneTarget@@', '.?AVTuningTarget@@',
              '.?AVSeatInputFilter@@', '.?AVDebugWait@@', '.?AVUpdatesWait@@', '.?AVMatchWait@@') {
            if ($exe.Contains($name)) { throw "Developer console code leaked into the package: $name" }
          }

      # Debug supports WARP and must start. The pinned engine's Release refuses
      # software adapters: only its exact no-hardware diagnostic may be skipped.
      # Content errors, crashes, missing windows and shutdown errors fail CI.
      - name: Audible clone starts from anywhere; missing-bank fallback starts separately
        shell: pwsh
        run: |
          $dir = "out/build/${{ matrix.preset }}/game"
          $arguments = @{
            Executable = Join-Path $dir 'ColourWars.exe'
            OutputDirectory = 'out/validation/startup'
            RequireAudio = $true
          }
          if ('${{ matrix.preset }}' -eq 'x64-release') {
            $dir = Join-Path $env:RUNNER_TEMP "ColourWars-release/ColourWars-windows-x64"
            $arguments.Executable = Join-Path $dir 'ColourWars.exe'
            $arguments.AllowNoHardwareAdapter = $true
            $arguments.SystemOnlyPath = $true
          }
          & ./scripts/check-startup.ps1 @arguments
          $bank = Join-Path $dir 'sounds/paint_exe.xwb'
          $backup = Join-Path $env:RUNNER_TEMP 'paint_exe-startup-backup.xwb'
          Move-Item -LiteralPath $bank -Destination $backup
          try {
            $arguments.Remove('RequireAudio')
            $arguments.RequireNoAudio = $true
            $arguments.OutputDirectory = 'out/validation/startup/missing-bank'
            & ./scripts/check-startup.ps1 @arguments
          }
          finally {
            Move-Item -LiteralPath $backup -Destination $bank
          }

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-${{ matrix.preset }}
          path: out/validation/startup
          if-no-files-found: ignore
