# Configure and build on a clean checkout, then check the game still starts.
#
# The engine's own CI (matt439/Labrador) runs the tests and the benchmark.
# There is nothing to run here: Labrador puts its test targets behind
# PROJECT_IS_TOP_LEVEL, so a consumer's ctest is empty by design. What this
# job proves is the thing only a consumer can prove — that the pinned engine
# revision and this game still build and link together.
#
# It runs on a runner with no wave bank, which is the point rather than a
# limitation: the audio sources are not in this repository (see NOTICE), so
# every run is a real clone of what a new contributor gets.

name: build

on:
  push:
    branches: [master, 'review-*']
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. A queue of stale runs on
# a repository with one maintainer is a queue nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [x64-debug, x64-release]

    # The presets use the Ninja generator, so every cmake step needs the MSVC
    # environment. vcvars64 is found through vswhere rather than a hardcoded
    # path, because the runner image's Visual Studio edition is not this
    # repository's business - and through vswhere rather than a third-party
    # action, because a build that can be done with the tools already on the
    # machine should not add a supply chain to do it.
    defaults:
      run:
        shell: cmd

    steps:
      # submodules: recursive, because external/labrador is the engine and
      # without it the first configure fails on a missing add_subdirectory.
      #
      # No token is needed for it: Labrador is public. This is worth knowing
      # because it briefly was not, and the failure was loud and unobvious -
      # the default GITHUB_TOKEN is scoped to *this* repository, so a private
      # engine gives "remote: Repository not found" at checkout, before any
      # build step runs. If Labrador is ever made private again, this needs a
      # PAT with read access to it:
      #
      #     token: ${{ secrets.ENGINE_SUBMODULE_TOKEN }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMakePresets.json reads $env{VCPKG_ROOT} for the toolchain file and
      # configuring fails without it. This is the same one-time step the README
      # asks a person to do.
      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # The manifest's dependencies are built at configure time, which is most
      # of this job's wall clock. Keyed on vcpkg.json, so a run that changes no
      # dependency reuses the last one's binaries.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Find vcvars64
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do echo VCVARS=%%i\VC\Auxiliary\Build\vcvars64.bat>> %GITHUB_ENV%

      - name: Configure
        run: |
          call "%VCVARS%"
          cmake --preset ${{ matrix.preset }}

      # This includes the engine's check_engine_includes target, which still
      # runs when Labrador is built as a subdirectory - and here it is the only
      # thing enforcing the rule, because from this tree an engine file
      # reaching for "game/..." would resolve.
      - name: Build
        run: |
          call "%VCVARS%"
          cmake --build --preset ${{ matrix.preset }}

      # A clone has no wave bank, so the game should reach its window in
      # silence rather than throwing on the file the manifest names. That is
      # the regression this exists to catch.
      #
      # NOT GATING, and the reason is honest: a Direct3D 11 device on a
      # headless runner is not the thing under test. If it fails because the
      # runner has no adapter, that is a fact about the runner. Read the log; a
      # startup *exception* names itself on stderr and is worth acting on, a
      # device failure is not.
      - name: A clone with no audio still starts
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = "out/build/${{ matrix.preset }}/game"
          if (Test-Path "$dir/sounds/sound_bank_1.xwb") {
            Write-Error "the runner has a wave bank; this check assumes a clone has none"
            exit 1
          }
          $p = Start-Process -FilePath "$dir/ArtAttackGame.exe" `
            -WorkingDirectory $dir -PassThru `
            -RedirectStandardError "$dir/startup.err" `
            -RedirectStandardOutput "$dir/startup.out"
          Start-Sleep -Seconds 15
          $p.Refresh()
          $exited = $p.HasExited
          $window = 0
          if (-not $exited) {
            $window = $p.MainWindowHandle.ToInt64()
            $p.Kill()
          }
          Write-Output "--- stderr ---"
          $stderr = Get-Content "$dir/startup.err" -ErrorAction SilentlyContinue
          $stderr
          if ($exited) {
            Write-Error "the game exited during startup (code $($p.ExitCode))"
            exit 1
          }
          # "Still running" on its own is not the thing this step claims. A
          # startup throw is caught in wWinMain, which prints the reason and
          # then opens a modal MessageBox - a call that never returns on a
          # runner with nobody to click it. So a failure is alive at 15 s and
          # has a window too, and only the stderr line tells the two apart.
          if ($stderr -match "startup failure") {
            Write-Error "the game threw during startup"
            exit 1
          }
          if ($window -eq 0) {
            Write-Error "the game is running but never opened a window"
            exit 1
          }
          Write-Output "the game reached its window without a wave bank"
