# Build against the pinned engine, with accepted audio and its optional fallback.
# Engine tests and benchmarks run in Labrador's CI; this consumer has no ctest targets.

name: build

on:
  push:
    branches: [master]
    # A version tag builds in full and publishes its Release ZIP (job publish).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The jobs read the repository and this workflow's runs, and upload artifacts.
permissions:
  contents: read
  actions: read

# A newer push replaces a branch's run. Master keeps every run: with one group,
# a docs-only merge cancelled a full build of the code merged before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      skip_windows: ${{ steps.changes.outputs.skip_windows }}
      tree: ${{ steps.changes.outputs.tree }}
    steps:
      # Compare the whole push/PR without building the engine. The pinned
      # engine is checked out (not its own submodules) so the link check can
      # reach the engine files the docs link to.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Check CI selection, links, frame and balance matrix analysis, study paths and paint colour vision
        run: |
          python3 -m unittest discover -s scripts/ci -p test_*.py
          python3 -m unittest discover -s scripts/balance -p test_*.py
          python3 -m unittest discover -s scripts/perf -p test_*.py
          python3 -m unittest discover -s scripts/studies -p test_*.py
          python3 -m unittest discover -s scripts/colour_vision -p test_*.py

      # A pull request runs the whole suite once, and the record job names the
      # tree it passed. A push of that same tree, such as the merge commit of a
      # branch already up to date with master, is not built again.
      - name: Lint changes and select build jobs
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/lint.py

      # Relative links and heading anchors in tracked Markdown outside the engine.
      - name: Check local Markdown links
        run: python3 scripts/ci/check_doc_links.py

  windows:
    needs: lint
    if: needs.lint.outputs.skip_windows != 'true'
    name: windows (${{ matrix.leg }})
    runs-on: windows-latest
    # The slowest run so far took 29 minutes as one job per preset.
    timeout-minutes: 60

    # Each leg builds for itself: a rebuild costs a parallel runner, a shared
    # build would cost every leg a serial wait. crossfeed has a Debug leg of
    # its own because it alone is as long as the rest of the suite.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: debug-crossfeed, preset: x64-debug, acceptance: true, selection: '-OwnLegOnly' }
          - { leg: debug-cases, preset: x64-debug, acceptance: true, selection: '-SkipOwnLeg' }
          - { leg: debug-checks, preset: x64-debug, checks: true }
          - { leg: release-cases, preset: x64-release, acceptance: true, quick_opt_in: true }
          - { leg: release-checks, preset: x64-release, checks: true }

    # Ninja builds need the MSVC environment, which Set up MSVC exports once.
    defaults:
      run:
        shell: cmd

    steps:
      # Include Labrador and its nested dependencies.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Shared with nightly: the same vcpkg cache, runner facts and MSVC environment.
      - uses: ./.github/actions/windows-setup

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }}

      # Building also runs Labrador's include-boundary check.
      - name: Build
        id: build
        run: |
          cmake --build --preset ${{ matrix.preset }}

      # Once the build is good every check below runs, whatever an earlier one
      # did, so one failure does not hide the rest until a second run.

      - name: Audio pipeline, publication and staging checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.checks }}
        shell: pwsh
        run: python -m unittest discover -s scripts/audio -p test_*.py

      # CI#2: compile, but never run, the probes CI does not otherwise build:
      # the opt-in acceptance cases (-OptIn, the 'opt-in' group in
      # scripts/acceptance/cases.psd1), the painter with both pad readers,
      # paint effects and, Debug-only like its harness, frame pacing. The Debug
      # console helper also builds and queries its CPU menu model; no window,
      # input or GPU is used. nightly.yml runs the painter and paint effects.
      - name: Compile gate for opt-in probes
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.checks }}
        run: |
          pwsh -NoProfile -File scripts/run-acceptance.ps1 -Preset ${{ matrix.preset }} -SkipBuild -CompileOnly -Parallel 4 -OutputDirectory out/validation/compile-gate/acceptance -OptIn
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-painter.ps1 -Preset ${{ matrix.preset }} -SkipBuild -CompileOnly -OutputDirectory out/validation/compile-gate/painter
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-paint-fx.ps1 -Preset ${{ matrix.preset }} -SkipBuild -CompileOnly -OutputDirectory out/validation/compile-gate/paint-fx
          if errorlevel 1 exit /b 1
          if "${{ matrix.preset }}"=="x64-debug" pwsh -NoProfile -File scripts/check-frame-pacing.ps1 -Preset x64-debug -SkipBuild -CompileOnly -OutputDirectory out/validation/compile-gate/frame-pacing
          if errorlevel 1 exit /b 1
          if "${{ matrix.preset }}"=="x64-debug" pwsh -NoProfile -File scripts/check-debug-console.ps1 -Preset x64-debug -CompileOnly -OutputDirectory out/validation/compile-gate/console-menu
          if errorlevel 1 exit /b 1

      - name: Upload compile gate evidence
        if: always() && matrix.checks
        uses: actions/upload-artifact@v7
        with:
          name: compile-gate-${{ matrix.preset }}
          path: |
            out/validation/compile-gate/**/*.json
            out/validation/compile-gate/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Acceptance tooling preflight, ownership and deadlines
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leg == 'debug-checks' }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-build.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-build.ps1
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-acceptance-selection.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-acceptance-selection.ps1
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-painter-selection.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-painter-selection.ps1
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-painter-evidence.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-painter-evidence.ps1
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-probe-helpers.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-probe-helpers.ps1
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-acceptance-process.ps1
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-acceptance-process.ps1

      - name: Upload acceptance tooling evidence
        if: always() && matrix.leg == 'debug-checks'
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-tooling
          path: |
            out/validation/acceptance-process/**/*.json
            out/validation/acceptance-process/**/*.log
            out/validation/acceptance-process/**/*.raw
            out/validation/acceptance-selection/**/*.json
            out/validation/acceptance-selection/**/*.log
            out/validation/painter-selection/**/*.json
            out/validation/painter-selection/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      # Four cases at a time on the runner's four cores. Every event runs the
      # full suite, so a pull request's run is the one its merge relies on.
      # The deadline is about twice the slowest case seen, 815 s.
      - name: Consumer acceptance checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.acceptance }}
        run: |
          pwsh -NoProfile -File scripts/run-acceptance.ps1 -Preset ${{ matrix.preset }} -SkipBuild -Parallel 4 -RunTimeoutSeconds 1800 ${{ matrix.selection }}

      # The opt-in cases short enough for every pull request ('Quick' in
      # cases.psd1). The rest, bot_team_trials above all, run in nightly.yml.
      - name: Quick opt-in cases
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.quick_opt_in }}
        run: |
          pwsh -NoProfile -File scripts/run-acceptance.ps1 -Preset ${{ matrix.preset }} -SkipBuild -Parallel 4 -RunTimeoutSeconds 1800 -QuickOptIn -OutputDirectory out/acceptance-quick-opt-in

      # CI#4: per-case compile and run seconds, outcome, longest first. The
      # data the scheduling order in cases.psd1 should rest on.
      - name: Upload acceptance timing summary
        if: always() && matrix.acceptance
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-summary-${{ matrix.leg }}
          path: |
            out/acceptance/${{ matrix.preset }}/acceptance-summary.json
            out/acceptance-quick-opt-in/${{ matrix.preset }}/acceptance-summary.json
          if-no-files-found: ignore
          retention-days: 30

      # Hidden, scripted correctness checks, and the only match frames either
      # preset draws on a pull request. The runner's Microsoft Basic Render
      # Driver is a software rasteriser that DXGI does not flag as software, so
      # the engine reports it as hardware and this passes the hardware-only
      # gate. That establishes no hardware or performance acceptance.
      - name: Movement feedback rendering checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.checks }}
        timeout-minutes: 20
        run: |
          pwsh -NoProfile -File scripts/check-movement-feedback.ps1 -Preset ${{ matrix.preset }} -SkipBuild

      # Keep structured diagnostics on failure without uploading the probe's
      # executable, objects or large raw PPM capture matrix.
      - name: Upload movement feedback evidence
        if: always() && matrix.checks
        uses: actions/upload-artifact@v7
        with:
          name: movement-feedback-${{ matrix.preset }}
          path: |
            out/validation/movement-feedback/**/*.json
            out/validation/movement-feedback/**/*.csv
            out/validation/movement-feedback/**/*.log
            out/validation/movement-feedback/**/*.err
          if-no-files-found: ignore
          retention-days: 7

      - name: Level editor acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.checks }}
        run: |
          cmake --build --preset ${{ matrix.preset }} --target ColourWarsEditor colourwars_editor_acceptance colourwars_editor_dpi_acceptance
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-level-editor.ps1 -Preset ${{ matrix.preset }} -SkipBuild

      # CI#3: both are hidden and input-free (about 20 s and 1 s locally). The
      # registration check stages a scratch game and runs check-startup on it;
      # the failure check reads and closes its own process's dialog by message.
      - name: Stage registration integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.checks }}
        timeout-minutes: 10
        run: |
          cmake --build --preset ${{ matrix.preset }} --target ColourWarsRegisterStage
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-stage-registration.ps1 -Preset ${{ matrix.preset }} -SkipBuild -OutputDirectory out/validation/stage-registration

      - name: Entry-point failure reporting
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.checks }}
        timeout-minutes: 5
        run: |
          pwsh -NoProfile -File scripts/check-failure-reporting.ps1 -Preset ${{ matrix.preset }} -SkipBuild -OutputDirectory out/validation/failure-reporting

      # Hidden; a real GameLevel lifecycle with a recording adapter.
      - name: Display awake over a match's lifetime
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.checks }}
        timeout-minutes: 10
        run: |
          pwsh -NoProfile -File scripts/check-display-awake.ps1 -Preset ${{ matrix.preset }} -SkipBuild -OutputDirectory out/validation/display-awake

      # A synthetic ZIP: no build, compiler or sandbox.
      - name: Sandbox trial generator
        if: ${{ !cancelled() && matrix.leg == 'release-checks' }}
        timeout-minutes: 5
        run: |
          pwsh -NoProfile -File scripts/check-sandbox-release.ps1 -OutputDirectory out/validation/sandbox-check

      # REL#3: the candidate script's refusals, in a scratch repository with
      # no build. The candidate itself runs by hand (docs/releasing.md).
      - name: Release candidate refusals
        if: ${{ !cancelled() && matrix.leg == 'release-checks' }}
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-release-candidate.ps1 -OutputDirectory out/validation/release-candidate-check
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts/check-release-candidate.ps1 -OutputDirectory out/validation/release-candidate-check

      # Receipts and logs only: each registration run also holds a scratch
      # repository, a junction to it and a staged game, none of them uploaded.
      - name: Upload registration and failure-reporting evidence
        if: always() && matrix.checks
        uses: actions/upload-artifact@v7
        with:
          name: registration-failure-reporting-${{ matrix.preset }}
          path: |
            out/validation/stage-registration/*/*.json
            out/validation/stage-registration/*/*.log
            out/validation/stage-registration/*/*.txt
            out/validation/stage-registration/*/startup/*/result.json
            out/validation/stage-registration/*/startup/*/startup.err
            out/validation/stage-registration/*/startup/*/startup.out
            out/validation/failure-reporting/*/*/result.json
            out/validation/failure-reporting/*/*/*/result.json
            out/validation/failure-reporting/*/*/*/dialog-*.txt
            out/validation/failure-reporting/*/*/*/metadata.log
            out/validation/failure-reporting/*/*/*/startup.err
            out/validation/failure-reporting/*/*/*/startup.out
            out/validation/display-awake/*/*/result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Package Release
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leg == 'release-checks' }}
        run: |
          cmake --build --preset x64-release --target package

      # CI#6: the packaging rules are a script, runnable locally the same way.
      - name: Extract and inspect Release package
        id: inspect
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/check-release-package.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'ColourWars-release')

      # Both presets must start, on the adapter described at the movement
      # check; Release starts from the inspected package. Losing that adapter,
      # content errors, crashes, missing windows and shutdown errors fail CI.
      # A muted process: this proves the bank opens, not how it sounds.
      - name: The bank opens from anywhere; missing-bank fallback starts separately
        if: ${{ !cancelled() && matrix.checks && steps.build.outcome == 'success' && (matrix.preset == 'x64-debug' || steps.inspect.outcome == 'success') }}
        shell: pwsh
        run: |
          $dir = "out/build/${{ matrix.preset }}/game"
          $arguments = @{
            Executable = Join-Path $dir 'ColourWars.exe'
            OutputDirectory = 'out/validation/startup'
            RequireAudio = $true
          }
          if ('${{ matrix.preset }}' -eq 'x64-release') {
            $dir = Join-Path $env:RUNNER_TEMP "ColourWars-release/ColourWars-windows-x64"
            $arguments.Executable = Join-Path $dir 'ColourWars.exe'
            $arguments.SystemOnlyPath = $true
          }
          & ./scripts/check-startup.ps1 @arguments
          $bank = Join-Path $dir 'sounds/paint_exe.xwb'
          $backup = Join-Path $env:RUNNER_TEMP 'paint_exe-startup-backup.xwb'
          Move-Item -LiteralPath $bank -Destination $backup
          try {
            $arguments.Remove('RequireAudio')
            $arguments.RequireNoAudio = $true
            $arguments.OutputDirectory = 'out/validation/startup/missing-bank'
            & ./scripts/check-startup.ps1 @arguments
          }
          finally {
            Move-Item -LiteralPath $backup -Destination $bank
          }

      # ROAD#16: one valid and one broken stage in the isolated profile's
      # stage folder; the broken one is one stderr line and startup goes on.
      - name: A broken user stage is refused without stopping startup
        if: ${{ !cancelled() && matrix.checks && steps.build.outcome == 'success' && (matrix.preset == 'x64-debug' || steps.inspect.outcome == 'success') }}
        shell: pwsh
        run: |
          $arguments = @{
            Executable = "out/build/${{ matrix.preset }}/game/ColourWars.exe"
            OutputDirectory = 'out/validation/startup/user-stages'
            UserStageFixture = $true
          }
          if ('${{ matrix.preset }}' -eq 'x64-release') {
            $arguments.Executable = Join-Path $env:RUNNER_TEMP 'ColourWars-release/ColourWars-windows-x64/ColourWars.exe'
            $arguments.SystemOnlyPath = $true
          }
          & ./scripts/check-startup.ps1 @arguments

      # GAP#L11: the test locale composes and passes every startup check.
      - name: The test locale starts
        if: ${{ !cancelled() && matrix.checks && steps.build.outcome == 'success' && (matrix.preset == 'x64-debug' || steps.inspect.outcome == 'success') }}
        shell: pwsh
        run: |
          $arguments = @{
            Executable = "out/build/${{ matrix.preset }}/game/ColourWars.exe"
            OutputDirectory = 'out/validation/startup/locale'
            Locale = 'qps-ploc'
          }
          if ('${{ matrix.preset }}' -eq 'x64-release') {
            $arguments.Executable = Join-Path $env:RUNNER_TEMP 'ColourWars-release/ColourWars-windows-x64/ColourWars.exe'
            $arguments.SystemOnlyPath = $true
          }
          & ./scripts/check-startup.ps1 @arguments

      # Only a ZIP that passed inspection, its version stamp and startup.
      - name: Upload Release package
        if: matrix.leg == 'release-checks'
        uses: actions/upload-artifact@v7
        with:
          name: ColourWars-windows-x64
          path: out/build/x64-release/packages/ColourWars-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      # REL#7: that executable's symbols, never in the ZIP. Named for the
      # revision so a crash report's build finds its PDB; publish attaches it
      # to the GitHub Release.
      - name: Upload Release symbols
        if: matrix.leg == 'release-checks'
        uses: actions/upload-artifact@v7
        with:
          name: ColourWars-symbols-${{ github.sha }}
          path: out/build/x64-release/game/ColourWars.pdb
          if-no-files-found: error
          retention-days: 14

      - name: Upload startup evidence
        if: always() && matrix.checks
        uses: actions/upload-artifact@v7
        with:
          name: startup-${{ matrix.preset }}
          path: out/validation/startup
          if-no-files-found: ignore
          retention-days: 7

  # A v* tag on master publishes the ZIP its own run built, inspected and
  # started, and that executable's PDB. The tag must name the packaged
  # version, so v0.1.0 needs project(VERSION 0.1.0); the versioning rule
  # (docs/releasing.md, REL#6) moves it in the first commit after a tag. scripts/ci/release.py holds the checks and the notes,
  # tested by the lint job; docs/releasing.md says what to do if this fails.
  publish:
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag is on master and names the packaged version
        id: release
        run: python3 scripts/ci/release.py check --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --master origin/master

      - uses: actions/download-artifact@v8
        with:
          name: ColourWars-windows-x64

      - uses: actions/download-artifact@v8
        with:
          name: ColourWars-symbols-${{ github.sha }}

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.release.outputs.package }}
          SYMBOLS: ${{ steps.release.outputs.symbols_asset }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          python3 scripts/ci/release.py notes --version "$VERSION" --output notes.md
          # REL#6: a 0.x version is a pre-release.
          prerelease=()
          if [ "$PRERELEASE" = "true" ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$PACKAGE" "$SYMBOLS" \
            --verify-tag --title "ColourWars $GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"

  # Only after every Windows job passed on the commit they checked out (a pull
  # request's test merge): its tree is what a later push may skip on.
  record:
    needs: [lint, windows]
    if: github.event_name == 'pull_request' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Name the passed tree
        run: echo "${{ github.sha }}" > passed-commit.txt

      - name: Record the passed tree
        uses: actions/upload-artifact@v7
        with:
          name: passed-tree-${{ needs.lint.outputs.tree }}
          path: passed-commit.txt
          if-no-files-found: error
          retention-days: 90

  # The one required check on master, so the ruleset names no matrix leg. It
  # must run and judge for itself: a job skipped because a job it needs failed
  # reports success, and a failed lint also leaves the Windows jobs skipped.
  gate:
    needs: [lint, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Lint passed, and the Windows jobs passed or were rightly skipped
        env:
          LINT: ${{ needs.lint.result }}
          WINDOWS: ${{ needs.windows.result }}
          SKIP_WINDOWS: ${{ needs.lint.outputs.skip_windows }}
        run: |
          echo "lint=$LINT windows=$WINDOWS skip_windows=$SKIP_WINDOWS"
          [ "$LINT" = success ] || exit 1
          [ "$WINDOWS" = success ] && exit 0
          [ "$WINDOWS" = skipped ] && [ "$SKIP_WINDOWS" = true ]
