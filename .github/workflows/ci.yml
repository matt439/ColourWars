# Build the game against its pinned engine and check startup without private audio.
# Engine tests and benchmarks run in Labrador's CI; this consumer has no ctest targets.

name: build

on:
  push:
    branches: [master, 'review-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [x64-debug, x64-release]

    # Ninja builds need the MSVC environment supplied by vcvars64.bat.
    defaults:
      run:
        shell: cmd

    steps:
      # Include Labrador and its nested dependencies.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMakePresets.json requires VCPKG_ROOT to locate the toolchain.
      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Reuse dependency binaries across configure steps.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Find vcvars64
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do echo VCVARS=%%i\VC\Auxiliary\Build\vcvars64.bat>> %GITHUB_ENV%

      - name: Configure
        run: |
          call "%VCVARS%"
          cmake --preset ${{ matrix.preset }}

      # Building also runs Labrador's include-boundary check.
      - name: Build
        run: |
          call "%VCVARS%"
          cmake --build --preset ${{ matrix.preset }}

      - name: Package Release
        if: matrix.preset == 'x64-release'
        run: |
          call "%VCVARS%"
          cmake --build --preset x64-release --target package

      - name: Extract and inspect Release package
        if: matrix.preset == 'x64-release'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "ColourWars-release"
          Expand-Archive -LiteralPath "out/build/x64-release/packages/ColourWars-windows-x64.zip" -DestinationPath $destination
          $package = Join-Path $destination "ColourWars-windows-x64"
          $files = Get-ChildItem -LiteralPath $package -File -Recurse
          if ($files | Where-Object {
            $_.Extension -in '.xwb', '.wav', '.mp3', '.pdb' -or
            ($_.Extension -eq '.exe' -and $_.Name -ne 'ColourWars.exe')
          }) { throw "Development files or audio leaked into the package" }
          foreach ($required in 'ColourWars.exe', 'DirectXTK.dll', 'xaudio2_9redist.dll',
            'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'build-info.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $package $required))) {
              throw "Package is missing $required"
            }
          }

      # Launch from the workspace root to verify executable-relative content paths
      # and the missing-audio fallback. This is advisory because headless runners
      # may lack a D3D11 adapter; inspect stderr for application startup failures.
      - name: A clone with no audio still starts, from anywhere
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = "out/build/${{ matrix.preset }}/game"
          # Release exercises the extracted, redistributable package outside
          # the checkout. Debug retains the ordinary build smoke check.
          if ('${{ matrix.preset }}' -eq 'x64-release') {
            $dir = Join-Path $env:RUNNER_TEMP "ColourWars-release/ColourWars-windows-x64"
          }
          if (Test-Path "$dir/sounds/sound_bank_1.xwb") {
            Write-Error "the runner has a wave bank; this check assumes a clone has none"
            exit 1
          }
          $p = Start-Process -FilePath "$dir/ColourWars.exe" `
            -WorkingDirectory "${{ github.workspace }}" -PassThru `
            -RedirectStandardError "$dir/startup.err" `
            -RedirectStandardOutput "$dir/startup.out"
          Start-Sleep -Seconds 15
          $p.Refresh()
          $exited = $p.HasExited
          $window = 0
          if (-not $exited) {
            $window = $p.MainWindowHandle.ToInt64()
            $p.Kill()
          }
          Write-Output "--- stderr ---"
          $stderr = Get-Content "$dir/startup.err" -ErrorAction SilentlyContinue
          $stderr
          if ($exited) {
            Write-Error "the game exited during startup (code $($p.ExitCode))"
            exit 1
          }
          # A startup exception leaves a live modal MessageBox. Check stderr
          # as well as the process and window to distinguish it from success.
          if ($stderr -match "startup failure") {
            Write-Error "the game threw during startup"
            exit 1
          }
          if ($window -eq 0) {
            Write-Error "the game is running but never opened a window"
            exit 1
          }
          Write-Output "the game reached its window without a wave bank, from the workspace root"
