# Build against the pinned engine, with accepted audio and its optional fallback.
# Engine tests and benchmarks run in Labrador's CI; this consumer has no ctest targets.

name: probe-diagnostic (temporary)

on:
  push:
    branches: ['claude/project-thread-lhxuu8']

# The jobs only read the repository and upload artifacts.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [x64-debug]

    # Ninja builds need the MSVC environment supplied by vcvars64.bat.
    defaults:
      run:
        shell: cmd

    steps:
      # Include Labrador and its nested dependencies.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMakePresets.json requires VCPKG_ROOT to locate the toolchain.
      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Reuse dependency binaries across configure steps.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Find vcvars64
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do echo VCVARS=%%i\VC\Auxiliary\Build\vcvars64.bat>> %GITHUB_ENV%

      - name: Configure
        run: |
          call "%VCVARS%"
          cmake --preset ${{ matrix.preset }}

      - name: Audio publication and staging checks
        shell: pwsh
        run: python -m unittest discover -s scripts/audio -p test_runtime_bank.py

      # Building also runs Labrador's include-boundary check.
      - name: Build
        run: |
          call "%VCVARS%"
          cmake --build --preset ${{ matrix.preset }}

      - name: Movement feedback rendering checks
        run: |
          call "%VCVARS%"
          pwsh -NoProfile -File scripts/check-movement-feedback.ps1 -Preset x64-debug -SkipBuild -AllowSoftwareAdapter

      - name: Show probe output
        if: always()
        shell: pwsh
        run: Get-ChildItem out/validation/movement-feedback -Recurse -Include *.log,*.err,*.json | ForEach-Object { "== $($_.FullName)"; Get-Content $_ -TotalCount 200 }
